<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Party Lines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <p class="eyebrow">A bar, a line of nights</p>
        <h1>Party Lines</h1>
      </div>
      <div id="stats" class="stats"></div>
      <div class="top-actions">
        <button type="button" id="run-week" class="button">Run week</button>
        <button type="button" id="reset" class="button button-ghost">Reset</button>
      </div>
      <nav id="nav" class="nav" aria-label="Game">
        <button type="button" data-view="timeline">Timeline</button>
        <button type="button" data-view="lineCreator">Line creator</button>
        <button type="button" data-view="departments">Departments</button>
        <button type="button" data-view="rooms">Rooms</button>
      </nav>
    </header>
    <main id="view"></main>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
